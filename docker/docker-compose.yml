version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dofusvalue_app
    restart: unless-stopped
    environment:
      - APP_ENV=production
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    networks:
      - dofusvalue

  nginx:
    image: nginx:alpine
    container_name: dofusvalue_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dofusvalue

  mysql:
    image: mysql:8
    container_name: dofusvalue_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dofus_value
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dofusvalue

  redis:
    image: redis:7-alpine
    container_name: dofusvalue_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - dofusvalue

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dofusvalue_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - mysql
      - redis
    networks:
      - dofusvalue

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dofusvalue_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      - mysql
      - redis
    networks:
      - dofusvalue

volumes:
  mysql_data:
  redis_data:

networks:
  dofusvalue:
    driver: bridge
